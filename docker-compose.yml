services:
  lexia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexia
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RERANK_MODEL=${RERANK_MODEL:-gpt-4o-mini}
